schema_version: 1

context:
  python_min: "3.10"
  version: "0.12.4"

package:
  name: pyjsg
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pyjsg/pyjsg-${{ version }}.tar.gz
  sha256: bb1c0ff1f50846d2b5185b182e28b0b6978eae51a2078ce3eb1e0f28dea7b9ab

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - generate_parser = pyjsg.parser_impl.generate_python:generate

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - uv-dynamic-versioning
    - pip
  run:
    - python >=${{ python_min }}
    - antlr4-python3-runtime >=4.9.3,<4.10.dev0
    - jsonasobj >=1.2.1
    - requests

tests:
  - python:
      imports:
        - pyjsg
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - generate_parser --help

about:
  summary: Python JSON Schema Grammar interpreter
  license: CC0-1.0
  license_file: license.txt
  homepage: https://pypi.org/project/PyJSG/
  repository: https://github.com/hsolbrig/pyjsg

extra:
  recipe-maintainers:
    - jfy133
    - bollwyvl
